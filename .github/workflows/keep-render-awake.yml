name: Keep Render Backend Awake

on:
  schedule:
    # Every 10 minutes (Render free tier sleeps after ~15 min idle)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "Error: Add RENDER_BACKEND_URL in GitHub repo Settings → Secrets and variables → Actions"
            exit 1
          fi

          HEALTH_URL="${BACKEND_URL%/}/api/health"
          echo "Pinging $HEALTH_URL"

          curl -fsS --max-time 60 -o /tmp/health.json -w "HTTP %{http_code}\n" "$HEALTH_URL"
          cat /tmp/health.json
          echo ""
